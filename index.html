  <head>

    <title>Knowledge Vault</title>
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"

    <!-- CSS style -->
    <link rel="stylesheet" href="styles/style.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"

  <body class="inter-font">
    <header>
      <nav class="nav-parent">
        <div class="img">
          <img src="./assets/logo-navbar.png" alt="" />

        </div>
        <div>
          <button class="btn">Get Early Access</button>

        <div class="banner-content">
          <p class="early">
            <i class="fa-solid fa-location-dot"></i>Early Access Now Open

          </p>
          <div class="button">
            <button class="button-1 btn">
              <div>Start Building Your Vault</div>

            </button>
            <button class="button-2 btn">
